name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag to rebuild (e.g., v0.3.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  detect-release:
    name: Resolve release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve manifest version and tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_commit=false
          source_sha="$(git rev-parse HEAD)"
          source_ref="$GITHUB_SHA"
          tag=
          version=

          write_outputs() {
            {
              echo "release_commit=${release_commit}"
              echo "source_sha=${source_sha}"
              echo "source_ref=${source_ref}"
              echo "tag=${tag}"
              echo "version=${version}"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REQUESTED_TAG"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: $tag" >&2
              exit 1
            fi
            test "$(git describe --tags --exact-match HEAD)" = "$tag"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            version="${tag#v}"
            source_ref="$tag"
          else
            version="$(jq -er '.["."] | select(type == "string")' .release-please-manifest.json)"
            tag="v${version}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              write_outputs
              exit 0
            fi
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^PKG_VERSION:=\([^[:space:]#]*\).*/\1/p' package/gl-modem-community/Makefile)"
          if [[ "$package_version" != "$version" ]]; then
            echo "Manifest version $version does not match PKG_VERSION $package_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            release_files=(
              "feed/25.12/gl-modem-community-${version}-r1.apk"
              "feed/25.12/packages.adb"
              "feed/24.10/gl-modem-community_${version}-r1_aarch64_cortex-a53.ipk"
              "feed/21.02/gl-modem-community_${version}-1_glinet-21.02_aarch64_cortex-a53.ipk"
              "feed/23.05-be3600/gl-modem-community_${version}-r1_gl-be3600-4.9_aarch64_cortex-a53_neon-vfpv4.ipk"
            )
            for release_file in "${release_files[@]}"; do
              if [[ ! -s "$release_file" ]]; then
                write_outputs
                exit 0
              fi
            done
          fi

          release_commit=true
          write_outputs

  release-please:
    name: Maintain release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr_branch: ${{ steps.pr.outputs.pr_branch }}
      pr_sha: ${{ steps.pr.outputs.pr_sha }}
    steps:
      - name: Reconcile historical Release Please labels
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          config="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/release-please-config.json?ref=${GITHUB_SHA}" \
            --jq '.content' | base64 --decode)"
          baseline="$(jq -r '.["last-release-sha"] // empty' <<< "$config")"
          active=false
          if [[ -n "$baseline" ]]; then
            active=true
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state merged \
              --label 'autorelease: pending' \
              --limit 100 \
              --json number,mergeCommit \
              --jq '.[] | [.number, .mergeCommit.oid] | @tsv' |
            while IFS=$'\t' read -r number merge_sha; do
              compare_status="$(gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${merge_sha}...${baseline}" \
                --jq '.status')"
              case "$compare_status" in
                ahead|identical)
                  gh pr edit "$number" \
                    --repo "$GITHUB_REPOSITORY" \
                    --remove-label 'autorelease: pending' \
                    --add-label 'autorelease: tagged'
                  ;;
              esac
            done
          fi
          echo "active=${active}" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASELINE_ACTIVE: ${{ steps.baseline.outputs.active }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
          RELEASE_PRS_CREATED: ${{ steps.release.outputs.prs_created }}
        shell: bash
        run: |
          set -euo pipefail
          branch=
          sha=
          if [[ "$RELEASE_BASELINE_ACTIVE" == true && "$RELEASE_PRS_CREATED" != true ]]; then
            echo "Release Please baseline migration did not create a release PR" >&2
            exit 1
          fi
          if [[ "$RELEASE_PRS_CREATED" == true ]]; then
            branch="$(jq -er '.[0].headBranchName' <<< "$RELEASE_PRS")"
            if [[ "$branch" != release-please--* ]]; then
              echo "Unexpected Release Please branch: $branch" >&2
              exit 1
            fi
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha')"
          fi
          echo "pr_branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "pr_sha=${sha}" >> "$GITHUB_OUTPUT"

  build-release-pr:
    name: Build proposed release
    needs:
      - release-please
    if: needs.release-please.outputs.pr_branch != ''
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.release-please.outputs.pr_sha }}
      upload_packages: true
    permissions:
      contents: read

  prepare-release-pr:
    name: Add signed feeds to release PR
    needs:
      - release-please
      - build-release-pr
    if: needs.build-release-pr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    permissions:
      actions: write
      contents: write
    outputs:
      ci_run_id: ${{ steps.feed.outputs.ci_run_id }}
      feed_sha: ${{ steps.feed.outputs.feed_sha }}
    steps:
      - name: Check out release PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download proposed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Restore APK SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tool-cache/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          key: openwrt-sdk-25.12.5-mediatek-filogic-ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25

      - name: Prepare pinned APK SDK
        run: make prepare-apk-sdk

      - name: Sign APK and generate feeds
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APK_SIGNING_PRIVATE_KEY"
          version="$(jq -er '.["."]' .release-please-manifest.json)"
          package_version="$(sed -n 's/^PKG_VERSION:=\([^[:space:]#]*\).*/\1/p' package/gl-modem-community/Makefile)"
          test "$version" = "$package_version"
          apk="release-assets/gl-modem-community-${version}-r1.apk"
          test -s "$apk"

          umask 077
          signing_dir="$(mktemp -d "${RUNNER_TEMP}/signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > "$signing_dir/private-key.pem"
          unset APK_SIGNING_PRIVATE_KEY

          docker build --platform linux/amd64 -t mt3000-openwrt-sdk:25.12.5 tools/sdk-container
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$(pwd),dst=/repo" \
            --mount "type=bind,src=${signing_dir},dst=/signing,readonly" \
            mt3000-openwrt-sdk:25.12.5 \
            make -C /repo --no-print-directory sign-apk-release \
              SDK_DIR=/repo/tool-cache/sdk-25.12.5-mediatek-filogic \
              PRIVATE_KEY=/signing/private-key.pem \
              PUBLIC_KEY=/repo/keys/gl-modem-community.pem \
              APK="/repo/${apk}" \
              OUTPUT_INDEX=/repo/release-assets/packages.adb \
              OUTPUT_METADATA=/repo/release-assets/gl-modem-community.apk.adb.json

          sh tools/assemble-release-feeds "$version" release-assets feed

      - name: Commit feeds and dispatch final CI
        id: feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          RELEASE_SHA: ${{ needs.release-please.outputs.pr_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_BRANCH" != release-please--* ]]; then
            echo "Unexpected Release Please branch: $RELEASE_BRANCH" >&2
            exit 1
          fi
          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_BRANCH}" --jq '.commit.sha')"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Release Please branch advanced from $RELEASE_SHA to $remote_sha" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if jq -e 'has("last-release-sha")' release-please-config.json >/dev/null; then
            config_tmp="$(mktemp "${RUNNER_TEMP}/release-please-config.XXXXXX")"
            jq 'del(.["last-release-sha"])' release-please-config.json > "$config_tmp"
            mv "$config_tmp" release-please-config.json
          fi
          git add release-please-config.json
          git add -f feed/
          if ! git diff --cached --quiet; then
            version="$(jq -er '.["."]' .release-please-manifest.json)"
            git commit -m "feed: v${version}"
            git remote set-url origin "https://github-actions:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          fi

          feed_sha="$(git rev-parse HEAD)"
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_BRANCH" \
            -f "source_ref=$feed_sha"

          ci_run_id=
          for attempt in {1..30}; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$RELEASE_BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,headSha)"
            ci_run_id="$(jq -r \
              --arg sha "$feed_sha" \
              --arg started "$dispatch_started" \
              '[
                .[] |
                select(.headSha == $sha and .createdAt >= $started)
              ] | sort_by(.createdAt) | last | .databaseId // empty' \
              <<< "$runs")"
            test -z "$ci_run_id" || break
            sleep 2
          done
          if [[ -z "$ci_run_id" ]]; then
            echo "Could not resolve dispatched CI run for $feed_sha" >&2
            exit 1
          fi
          {
            echo "ci_run_id=${ci_run_id}"
            echo "feed_sha=${feed_sha}"
          } >> "$GITHUB_OUTPUT"

  merge-release-pr:
    name: Merge validated release PR
    needs:
      - release-please
      - prepare-release-pr
    if: needs.prepare-release-pr.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Wait for exact release commit validation
        env:
          CI_RUN_ID: ${{ needs.prepare-release-pr.outputs.ci_run_id }}
          FEED_SHA: ${{ needs.prepare-release-pr.outputs.feed_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10
          run="$(gh run view "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,headSha,status,url)"
          jq -e \
            --arg sha "$FEED_SHA" \
            '
              .event == "workflow_dispatch" and
              .headSha == $sha and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$run" >/dev/null || {
              echo "Dispatched CI did not validate exact release commit $FEED_SHA" >&2
              jq . <<< "$run" >&2
              exit 1
            }

      - name: Squash merge validated release PR
        env:
          FEED_SHA: ${{ needs.prepare-release-pr.outputs.feed_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr view "$RELEASE_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --json baseRefName,headRefName,headRefOid,isDraft,number,state)"
          jq -e \
            --arg branch "$RELEASE_BRANCH" \
            --arg sha "$FEED_SHA" \
            '
              .baseRefName == "main" and
              .headRefName == $branch and
              .headRefOid == $sha and
              .isDraft == false and
              .state == "OPEN"
            ' <<< "$pr" >/dev/null || {
              echo "Release PR no longer matches validated commit $FEED_SHA" >&2
              jq . <<< "$pr" >&2
              exit 1
            }
          pr_number="$(jq -r '.number' <<< "$pr")"
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$FEED_SHA"

  release-ci:
    name: Validate release source
    needs:
      - detect-release
    if: needs.detect-release.outputs.release_commit == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.detect-release.outputs.source_ref }}
      upload_packages: false
    permissions:
      contents: read

  publish-release:
    name: Publish release
    needs:
      - detect-release
      - release-ci
    if: needs.release-ci.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect-release.outputs.source_ref }}
          persist-credentials: false

      - name: Restore APK SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tool-cache/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          key: openwrt-sdk-25.12.5-mediatek-filogic-ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25

      - name: Prepare pinned APK SDK
        run: make prepare-apk-sdk

      - name: Collect committed release packages
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          install -m 0644 \
            "feed/25.12/gl-modem-community-${RELEASE_VERSION}-r1.apk" \
            release-assets/
          install -m 0644 feed/25.12/packages.adb release-assets/
          install -m 0644 \
            "feed/24.10/gl-modem-community_${RELEASE_VERSION}-r1_aarch64_cortex-a53.ipk" \
            release-assets/
          install -m 0644 \
            "feed/21.02/gl-modem-community_${RELEASE_VERSION}-1_glinet-21.02_aarch64_cortex-a53.ipk" \
            release-assets/
          install -m 0644 \
            "feed/23.05-be3600/gl-modem-community_${RELEASE_VERSION}-r1_gl-be3600-4.9_aarch64_cortex-a53_neon-vfpv4.ipk" \
            release-assets/

      - name: Verify packages and generate SBOMs
        env:
          RELEASE_VERSION: ${{ needs.detect-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t mt3000-openwrt-sdk:25.12.5 tools/sdk-container
          docker run --rm --platform linux/amd64 \
            --env "RELEASE_VERSION=${RELEASE_VERSION}" \
            --mount "type=bind,src=$(pwd),dst=/repo" \
            mt3000-openwrt-sdk:25.12.5 \
            bash -ceu '
              apk_tool=/repo/tool-cache/sdk-25.12.5-mediatek-filogic/staging_dir/host/bin/apk
              apk=/repo/release-assets/gl-modem-community-${RELEASE_VERSION}-r1.apk
              ipk=/repo/release-assets/gl-modem-community_${RELEASE_VERSION}-r1_aarch64_cortex-a53.ipk
              glinet21_ipk=/repo/release-assets/gl-modem-community_${RELEASE_VERSION}-1_glinet-21.02_aarch64_cortex-a53.ipk
              be3600_ipk=/repo/release-assets/gl-modem-community_${RELEASE_VERSION}-r1_gl-be3600-4.9_aarch64_cortex-a53_neon-vfpv4.ipk

              "$apk_tool" verify --keys-dir /repo/keys "$apk"
              "$apk_tool" verify --keys-dir /repo/keys /repo/release-assets/packages.adb
              "$apk_tool" adbdump --format json "$apk" \
                >/repo/release-assets/gl-modem-community.apk.adb.json
              "$apk_tool" adbdump --format json /repo/release-assets/packages.adb \
                >/tmp/packages-index.json
              jq -e --arg version "${RELEASE_VERSION}-r1" '"'"'
                (.packages // .) as $packages |
                ([$packages[] | select(
                  .name == "gl-modem-community" and .version == $version
                )] | length) == 1
              '"'"' /tmp/packages-index.json >/dev/null
              tar -tzf "$ipk" >/dev/null
              tar -tzf "$glinet21_ipk" >/dev/null
              tar -tzf "$be3600_ipk" >/dev/null

              make -C /repo --no-print-directory generate-sbom \
                SBOM_FORMAT=apk \
                SBOM_ARTIFACT="$apk" \
                SBOM_OUTPUT=/repo/release-assets/gl-modem-community.apk.cdx.json \
                APK_METADATA=/repo/release-assets/gl-modem-community.apk.adb.json
              make -C /repo --no-print-directory generate-sbom \
                SBOM_FORMAT=ipk \
                SBOM_ARTIFACT="$ipk" \
                SBOM_OUTPUT=/repo/release-assets/gl-modem-community.ipk.cdx.json
              make -C /repo --no-print-directory generate-sbom \
                SBOM_FORMAT=ipk \
                SBOM_ARTIFACT="$glinet21_ipk" \
                SBOM_OUTPUT=/repo/release-assets/gl-modem-community.glinet21.ipk.cdx.json
              make -C /repo --no-print-directory generate-sbom \
                SBOM_FORMAT=ipk \
                SBOM_ARTIFACT="$be3600_ipk" \
                SBOM_OUTPUT=/repo/release-assets/gl-modem-community.be3600.ipk.cdx.json

              for sbom in /repo/release-assets/*.cdx.json; do
                make -C /repo --no-print-directory validate-sbom SBOM="$sbom"
                cyclonedx validate --input-file "$sbom"
              done

              validate_component() {
                sbom=$1
                expected_version=$2
                expected_architecture=$3
                jq -e \
                  --arg version "$expected_version" \
                  --arg architecture "$expected_architecture" \
                  '"'"'
                    .metadata.component.name == "gl-modem-community" and
                    .metadata.component.version == $version and
                    any(
                      .metadata.component.properties[];
                      .name == "openwrt:architecture" and .value == $architecture
                    )
                  '"'"' "$sbom" >/dev/null
              }
              validate_component \
                /repo/release-assets/gl-modem-community.apk.cdx.json \
                "${RELEASE_VERSION}-r1" aarch64_cortex-a53
              validate_component \
                /repo/release-assets/gl-modem-community.ipk.cdx.json \
                "${RELEASE_VERSION}-r1" aarch64_cortex-a53
              validate_component \
                /repo/release-assets/gl-modem-community.glinet21.ipk.cdx.json \
                "${RELEASE_VERSION}-1" aarch64_cortex-a53
              validate_component \
                /repo/release-assets/gl-modem-community.be3600.ipk.cdx.json \
                "${RELEASE_VERSION}-r1" aarch64_cortex-a53_neon-vfpv4
            '

      - name: Add keys and checksums
        run: |
          set -euo pipefail
          install -m 0644 keys/gl-modem-community.pem release-assets/
          install -m 0644 keys/gl-modem-community.pem.sha256 release-assets/
          checksums="$(mktemp "${RUNNER_TEMP}/SHA256SUMS.XXXXXX")"
          (
            cd release-assets
            for asset in *; do
              test "$asset" = SHA256SUMS || sha256sum -- "$asset"
            done | sort -k2
          ) > "$checksums"
          mv "$checksums" release-assets/SHA256SUMS
          (cd release-assets && sha256sum -c gl-modem-community.pem.sha256)

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/*

      - name: Create or update release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ needs.detect-release.outputs.tag }}
          target_commitish: ${{ needs.detect-release.outputs.source_sha }}
          name: ${{ needs.detect-release.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
